name: strapi

on:
  push:
    branches: [main]
    tags: ["strapi-v*"]
    paths: ["images/strapi/**", ".github/workflows/strapi.yml"]
  pull_request:
    paths: ["images/strapi/**", ".github/workflows/strapi.yml"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/provelox/strapi

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: strapi
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strapi -d strapi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t strapi:ci images/strapi

      - name: Build dev image
        run: docker build --target dev -t strapi:dev-ci images/strapi

      - name: Start container against Postgres
        run: |
          docker run -d --name strapi --network host \
            -e DATABASE_CLIENT=postgres -e DATABASE_HOST=127.0.0.1 -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=strapi -e DATABASE_USERNAME=strapi -e DATABASE_PASSWORD=ci-only-password \
            -e APP_KEYS="$(openssl rand -base64 32)" \
            -e API_TOKEN_SALT="$(openssl rand -base64 32)" \
            -e ADMIN_JWT_SECRET="$(openssl rand -base64 32)" \
            -e TRANSFER_TOKEN_SALT="$(openssl rand -base64 32)" \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            strapi:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1337/_health || true)
            if [ "$code" = "204" ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "Strapi did not become healthy"; docker logs strapi; exit 1

      - name: Check admin and runs as non-root
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/admin)" = "200"
          test "$(docker exec strapi id -u)" != "0"

      - name: Clean shutdown
        if: always()
        run: |
          docker logs strapi || true
          docker stop -t 20 strapi || true

  publish:
    # Publishing happens only for release tags (strapi-v1.2.3), and only after the smoke test passed
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/strapi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production: strapi-v1.2.3 -> :1.2.3, :1.2, :1 and :latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=strapi-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=strapi-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=strapi-v(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest

      - name: Publish production image
        uses: docker/build-push-action@v6
        with:
          context: images/strapi
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=strapi-runtime
          cache-to: type=gha,scope=strapi-runtime,mode=max

      # Dev (develop mode, for designing content types): same version, "-dev" suffix -> :1.2.3-dev, :1.2-dev, :1-dev, :latest-dev
      - id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-dev,onlatest=false
          tags: |
            type=match,pattern=strapi-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=strapi-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=strapi-v(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest

      - name: Publish dev image
        uses: docker/build-push-action@v6
        with:
          context: images/strapi
          target: dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=strapi-dev
          cache-to: type=gha,scope=strapi-dev,mode=max
